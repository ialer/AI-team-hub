services:
  hub:
    build: .
    image: ai-team-hub:latest
    container_name: ai-team-hub
    restart: unless-stopped
    ports:
      # Bind to one address, not 0.0.0.0. Default keeps the hub reachable only
      # from this host; set HUB_BIND_ADDR in .env to a LAN or VPN address when
      # other machines need to reach it.
      - "${HUB_BIND_ADDR:-127.0.0.1}:8899:8899"
    environment:
      HUB_PORT: "8899"
      HUB_HOST: "0.0.0.0"
      HUB_ADMIN_TOKEN: "${HUB_ADMIN_TOKEN:?set HUB_ADMIN_TOKEN in .env}"
      # Every ${VAR} referenced in config.json must be listed here, otherwise
      # it expands to an empty string inside the container and the feature that
      # needs it fails silently (a missing selector token looks like "no
      # questions were planned").
      YY_API_TOKEN: "${YY_API_TOKEN:-}"
      WORKBUDDY_API_KEY: "${WORKBUDDY_API_KEY:-}"
      # Media storage. Leave blank to keep files on the data volume.
      # config.json refers to these as ${R2_*}; they are expanded at load time.
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_PUBLIC_BASE_URL: "${R2_PUBLIC_BASE_URL:-}"
    volumes:
      # Everything persistent lives in ./data — back this up and you are done.
      - ./data:/app/data
      # Mount your config instead of baking it into the image.
      - ./config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8899/api/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
