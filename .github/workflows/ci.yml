name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint + smoke test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No dependencies to install — that is the point. If this step ever
      # becomes necessary, something has gone wrong with the design.
      - name: Verify zero runtime dependencies
        run: |
          node -e "
            const p = require('./package.json');
            const deps = Object.keys(p.dependencies || {});
            if (deps.length) {
              console.error('runtime dependencies are not allowed:', deps);
              process.exit(1);
            }
            console.log('ok: zero runtime dependencies');
          "

      - name: Syntax check
        run: |
          for f in $(find server connectors -name '*.mjs'); do
            node --check "$f"
          done

      # Byte sniffing, image header parsing, multipart splitting and the AWS
      # signature are all things you cannot verify by eye.
      - name: Unit tests
        run: npm test

      - name: Start hub and run a smoke test
        run: |
          cat > config.json <<'EOF'
          {
            "host": "127.0.0.1",
            "port": 8899,
            "adminToken": "ci-test-token",
            "wakeTimeout": 30,
            "agents": [
              {
                "id": "echo",
                "name": "echo",
                "mode": "push",
                "adapter": "cli-once",
                "config": {
                  "command": "node",
                  "args": ["-e", "console.log('pong')"],
                  "timeoutMs": 15000
                }
              },
              { "id": "lp", "name": "lp", "mode": "connector" }
            ]
          }
          EOF

          node server/index.mjs &
          HUB_PID=$!
          trap "kill $HUB_PID" EXIT
          sleep 2

          # 1. state endpoint answers
          curl -sf http://127.0.0.1:8899/api/state > /dev/null

          # 2. tokens are server-issued and stored: same value on every read,
          #    and present for a config-declared agent (seeded at boot).
          T1=$(node server/tokens.mjs lp | awk '{print $2}')
          T2=$(node server/tokens.mjs lp | awk '{print $2}')
          [ -n "$T1" ] || { echo "token empty"; exit 1; }
          [ "$T1" = "$T2" ] || { echo "token changed between reads"; exit 1; }

          # 3. push adapter round trip
          curl -sf -X POST http://127.0.0.1:8899/api/say \
            -H 'Content-Type: application/json' \
            -d '{"room":"team","from":"human","text":"@echo ping"}' > /dev/null
          sleep 2

          REPLY=$(curl -sf "http://127.0.0.1:8899/api/messages?room=team" \
                  | node -e "
                      let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                        const m=JSON.parse(s).messages.find(x=>x.from==='echo');
                        process.stdout.write(m?m.text:'');
                      });")
          [ "$REPLY" = "pong" ] || { echo "unexpected reply: [$REPLY]"; exit 1; }
          echo "smoke test passed"

      # The onboarding path is the part a new user hits first, so it gets its
      # own end-to-end check: invite code → join → agent exists → token works.
      - name: Onboarding smoke test (invite → join → authenticated call)
        run: |
          cat > config.json <<'EOF'
          {
            "host": "127.0.0.1",
            "port": 8899,
            "adminToken": "ci-join-token",
            "wakeTimeout": 30,
            "agents": [{ "id": "seed", "name": "seed", "mode": "connector" }]
          }
          EOF

          node server/index.mjs &
          HUB_PID=$!
          trap "kill $HUB_PID" EXIT
          sleep 2

          ADMIN=ci-join-token
          BASE=http://127.0.0.1:8899

          # 1) admin token required
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST $BASE/api/admin/invites)
          [ "$code" = "401" ] || { echo "invite without admin should be 401, got $code"; exit 1; }

          # 2) mint an invite
          INV=$(curl -sf -X POST $BASE/api/admin/invites -H "X-Admin-Token: $ADMIN" \
                -H 'Content-Type: application/json' -d '{"ttlSec":60,"uses":1}')
          CODE=$(echo "$INV" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).invite.code))")
          [ -n "$CODE" ] || { echo "no invite code"; exit 1; }
          echo "invite: $CODE"

          # 3) join
          JOIN=$(curl -sf -X POST $BASE/api/join -H 'Content-Type: application/json' \
                 -d "{\"code\":\"$CODE\",\"id\":\"newbie\",\"name\":\"Newbie\",\"role\":\"test\"}")
          TOKEN=$(echo "$JOIN" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).token))")

          # 4) the agent is visible without a restart
          curl -sf $BASE/api/state | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const a = JSON.parse(s).agents;
              if (!a.newbie) { console.error('joined agent missing from /api/state'); process.exit(1); }
              console.log('joined agent visible');
            });"

          # 5) its token authenticates
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 -H "X-Agent-Id: newbie" -H "X-Agent-Token: $TOKEN" \
                 "$BASE/api/agent/poll?agent=newbie&timeout=1")
          [ "$code" = "200" ] || { echo "joined token should authenticate, got $code"; exit 1; }

          # 6) a wrong token must not
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 -H "X-Agent-Id: newbie" -H "X-Agent-Token: wrong" \
                 "$BASE/api/agent/poll?agent=newbie&timeout=1")
          [ "$code" = "401" ] || { echo "wrong token should be 401, got $code"; exit 1; }

          # 7) the code is single use
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST $BASE/api/join \
                 -H 'Content-Type: application/json' -d "{\"code\":\"$CODE\",\"id\":\"second\"}")
          [ "$code" = "403" ] || { echo "reused invite should be 403, got $code"; exit 1; }

          # 8) removal is immediate
          curl -sf -X DELETE "$BASE/api/admin/agents/newbie" -H "X-Admin-Token: $ADMIN" > /dev/null
          curl -sf $BASE/api/state | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              if (JSON.parse(s).agents.newbie) { console.error('removed agent still present'); process.exit(1); }
              console.log('removed agent gone');
            });"

          echo "onboarding smoke test passed"
      - name: Static assets are served
        run: |
          node server/index.mjs &
          HUB_PID=$!
          trap "kill $HUB_PID" EXIT
          sleep 2
          for p in / /style.css /app.js /admin.js /admin.css /store.mjs /connect.mjs; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8899$p")
            [ "$code" = "200" ] || { echo "$p returned $code"; exit 1; }
          done
          echo "static assets ok"

      - name: Health endpoint reports readiness
        run: |
          node server/index.mjs &
          HUB_PID=$!
          trap "kill $HUB_PID" EXIT
          sleep 2
          BODY=$(curl -sf http://127.0.0.1:8899/api/health)
          echo "$BODY"
          echo "$BODY" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const h=JSON.parse(s);
              if (h.ok !== true) { console.error('health not ok'); process.exit(1); }
              if (!h.version) { console.error('health missing version'); process.exit(1); }
            });"
          echo "health ok"

      - name: Metrics endpoint aggregates without leaking content
        run: |
          node server/index.mjs &
          HUB_PID=$!
          trap "kill $HUB_PID" EXIT
          sleep 2
          curl -sf -X POST http://127.0.0.1:8899/api/say \
            -H 'Content-Type: application/json' \
            -d '{"room":"team","from":"human","text":"metrics seed"}' > /dev/null
          curl -sf http://127.0.0.1:8899/api/metrics | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const m=JSON.parse(s);
              if (m.ok !== true) { console.error('metrics not ok'); process.exit(1); }
              if (!(m.messages.total >= 1)) { console.error('metrics missing message count'); process.exit(1); }
              const raw = JSON.stringify(m);
              if (raw.includes('metrics seed')) { console.error('metrics leaked message text'); process.exit(1); }
            });"
          echo "metrics ok"

      - name: Messages can be filtered by taskId
        run: |
          node server/index.mjs &
          HUB_PID=$!
          trap "kill $HUB_PID" EXIT
          sleep 2
          curl -sf -X POST http://127.0.0.1:8899/api/say -H 'Content-Type: application/json' \
            -d '{"room":"team","from":"human","text":"loose chat"}' > /dev/null
          curl -sf -X POST http://127.0.0.1:8899/api/say -H 'Content-Type: application/json' \
            -d '{"room":"team","from":"human","text":"grouped","taskId":"T1"}' > /dev/null
          N=$(curl -sf 'http://127.0.0.1:8899/api/messages?room=team&taskId=T1' | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).messages.length)));")
          [ "$N" = "1" ] || { echo "taskId filter returned $N messages, expected 1"; exit 1; }
          echo "taskId filter ok"

      - name: Surfaces accept writes behind an admin token
        run: |
          node server/index.mjs &
          HUB_PID=$!
          trap "kill $HUB_PID" EXIT
          sleep 2
          B=http://127.0.0.1:8899
          ADM=ci-test-token

          # anonymous write must be rejected
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/api/surface/docs \
                 -H 'Content-Type: application/json' -d '{"id":"x","content":"x"}')
          [ "$code" = "401" ] || { echo "anonymous write should be 401, got $code"; exit 1; }

          # admin write, then read it back through the shelf
          curl -sf -X POST $B/api/surface/docs -H "X-Admin-Token: $ADM" \
            -H 'Content-Type: application/json' -d '{"id":"ci-note","content":"# hi"}' > /dev/null
          N=$(curl -sf "$B/api/surface/docs" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const it=JSON.parse(s).items;process.stdout.write(String(it.filter(i=>i.id==='ci-note.md').length));});")
          [ "$N" = "1" ] || { echo "written doc not listed ($N)"; exit 1; }

          BODY=$(curl -sf "$B/api/surface/docs/ci-note.md")
          [ "$BODY" = "# hi" ] || { echo "doc content mismatch: [$BODY]"; exit 1; }

          curl -sf -X POST $B/api/surface/tasks -H "X-Admin-Token: $ADM" \
            -H 'Content-Type: application/json' -d '{"upsert":{"id":"t1","title":"x","status":"todo"}}' > /dev/null
          T=$(curl -sf "$B/api/surface/tasks" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).items.length)));")
          [ "$T" = "1" ] || { echo "task not written ($T)"; exit 1; }
          echo "surface write ok"
